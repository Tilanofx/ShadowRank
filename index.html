.row{animation:fd .5s both;animation-delay:calc(var(--i)*70ms)}

 </div>

  <g filter="url(#gl)"><ellipse className="eye" cx="83" cy="64" rx="5" ry="2" fill="#4cc3ff"/><ellipse className="eye" cx="97" cy="64" rx="5" ry="2" fill="#4cc3ff"/>
  <g className="slash"><line x1="56" y1="112" x2="22" y2="58" stroke="#c9d1de" strokeWidth="3" strokeLinecap="round"/></g>

  <rect className="trail" x="-10" y="118" width="60" height="3" fill="url(#bl)"/><rect className="trail" style=${{animationDelay:'.5s'}} x="-4" y="130" width="50" height="3" fill="url(#bl)"/><rect className="trail" style=${{animationDelay:'1s'}} x="0" y="124" width="40" height="2" fill="url(#bl)"/></g>

function Welcome(){
 const [show,setShow]=useState(()=>{try{return !sessionStorage.getItem('sr_w')}catch(e){return true}});
 if(!show)return null;
 const close=()=>{try{sessionStorage.setItem('sr_w','1')}catch(e){}setShow(false)};
 return html`<div className="modal fade" role="dialog" aria-modal="true"><div className="bg-panel border border-volt rounded-2xl p-6 max-w-sm text-center glow"><div className="inline-block float"><${Logo} size=${72}/></div>

  <p className="text-sm mt-3">Terima kasih sudah mampir! Pilih tier di katalog, isi form singkat, dan tim kami akan mengerjakan rank-mu dengan aman dan transparan.</p>
  <p className="text-xs mt-3 text-amber-300/90">Kami tidak pernah meminta password atau OTP lewat website.</p>
  <button className="btn w-full mt-4" onClick=${close}>Mulai Pesan</button></div></div>`}

function Sticky({pre,services}){
 const s=pre&&services.find(x=>x.id===pre.sid);
 return html`<div className="fixed bottom-0 inset-x-0 z-20 bg-black/90 backdrop-blur border-t border-line px-4 pt-3" style=${{paddingBottom:'calc(env(safe-area-inset-bottom,0px) + 12px)'}}><div className="max-w-xl mx-auto flex items-center gap-3">
  <div className="flex-1 text-xs min-w-0">${s?html`<b className="text-white">${s.name.replace('Joki Bintang ','')} × ${pre.qty}</b><br/><span className="text-ice">${rp(pre.qty*s.price)}</span>`:'Belum ada item produk yang dipilih.'}</div>
  <a href="#pesan" className="btn !py-2 text-sm whitespace-nowrap">Pesan Sekarang!</a></div></div>`}

function Catalog({services,pick,sync}){
 const [q,setQ]=useState({});
 const on=services.filter(s=>s.on);
 return html`<section id="katalog" className="px-4 py-8 max-w-xl mx-auto"><h2 className="text-xl font-bold text-white">Katalog Harga</h2><p className="text-xs text-silver/60 mb-3">Harga per bintang. Atur jumlah, lalu tekan Pesan.</p><${Duo}/>
 <div className="rounded-2xl border border-line overflow-hidden bg-panel/70"><video src="wildhhs.mp4" autoPlay loop muted playsInline preload="auto" className="video-anime mb-4" style=${{mixBlendMode:'screen'}}></video>${on.map((s,i)=>{const n=q[s.id]??1;const set=v=>{const val=Math.max(1,Math.min(MAXQ[s.name.replace('Joki Bintang ','')]??1000,Math.round(+v||1)));setQ({...q,[s.id]:val});sync(s.id,val)};
  return html`<div key=${s.id} className="row p-4 border-b border-line last:border-0 flex gap-3" style=${{'--i':i}}>
   <span className="badge" style=${{background:BADGE[i%8]}}>${i+1}</span>
   <div className="flex-1">
    <div className="flex justify-between items-baseline"><div><b className="text-white">${s.name.replace('Joki Bintang ','')}</b><div className="text-xs text-ice">${rp(s.price)} <span className="text-silver/50">/ bintang</span></div></div><b className="text-white">${rp(n*s.price)}</b></div>
    <div className="flex justify-between items-center mt-3"><div className="flex items-center gap-1"><button className="stp" aria-label="Kurangi" onClick=${()=>set(n-1)}>−</button><input type="number" min="1" value=${n} onChange=${e=>set(e.target.value)} style=${{width:64,textAlign:'center'}}/><button className="stp" aria-label="Tambah" onClick=${()=>set(n+1)}>+</button></div>
    <button className="btn !py-2 !px-5 text-sm" onClick=${()=>pick(s.id,n)}>Pesan</button></div></div></div>`})}</div></section>`}

function OrderForm({services,pre}){
 const act=services.filter(s=>s.on);
 const [f,setF]=useState({name:'',wa:'',sid:act[0]?.id,from:'Master',to:'Grandmaster',qty:1,note:'',hp:''});
 const [busy,setBusy]=useState(false),[err,setErr]=useState(''),[res,setRes]=useState(null),[agree,setAgree]=useState(false);
 useEffect(()=>{if(pre){const t=services.find(x=>x.id===pre.sid);const nm=t?t.name.replace('Joki Bintang ',''):'Master';setF(x=>({...x,sid:pre.sid,from:nm,to:nm,qty:pre.qty}))}},[pre]);
 const s=services.find(x=>x.name==='Joki Bintang '+f.from)||act[0];
const priceOf=t=>(services.find(x=>x.name==='Joki Bintang '+t)||{}).price||0;
const ia=RANKS.indexOf(f.from),ib=RANKS.indexOf(f.to),auto=ib>ia;
const rows=auto?RANKS.slice(ia,ib).map((t,i)=>({t,q:STARS[ia+i],p:priceOf(t)})):[{t:f.from,q:Math.max(0,+f.qty||0),p:priceOf(f.from)}];
const stars=rows.reduce((x,r)=>x+r.q,0),sub=rows.reduce((x,r)=>x+r.q*r.p,0);
const dp=(DISC.find(d=>stars>=d[0])||[0,0])[1],disc=Math.round(sub*dp/100)*100,est=sub-disc;
 const set=k=>e=>setF({...f,[k]:e.target.value});
 const submit=async()=>{
  setErr('');
  if(!LIVE)return setErr('Database belum terhubung (mode demo). Pesanan tidak dapat disimpan.');
  if(f.name.trim().length<2||!/^(\+?62|0)8\d{7,12}$/.test(f.wa.replace(/[\s-]/g,'')))return setErr('Isi nama dan nomor WhatsApp valid (08xx atau 628xx).');
  if(RANKS.indexOf(f.to)<RANKS.indexOf(f.from))return setErr('Rank tujuan harus sama atau lebih tinggi dari rank saat ini.');
  if(!(stars>=1&&stars<=1000))return setErr('Jumlah bintang 1–1000.');
       setBusy(true);
  try{setRes(await api({action:'create_order',name:f.name,wa:f.wa,service:s.id,rank_from:f.from,rank_to:f.to,qty:stars,note:('Rincian: '+rows.map(r=>r.t+' '+r.q+'x'+r.p).join(', ')+' | Diskon '+disc+' | Total '+est+(f.note?' | '+f.note:'')).slice(0,300),hp:f.hp}))}
  catch(e){setErr(e.message)}
  setBusy(false)};
 if(res){
  const msg=`Halo SHADOWRANK, saya sudah membuat pesanan:\n\nNo. Pesanan: ${res.order_no}\nNama: ${f.name}\nLayanan: ${s.name}\nRank Awal: ${f.from}\nTarget: ${f.to}\nJumlah: ${stars} bintang\nDiskon: ${rp(disc)}\nTotal: ${rp(est)}\nCatatan: ${f.note||'-'}\n\nMohon info pembayaran. Saya tidak akan membagikan password/OTP.`;
  return html`<section id="pesan" className="px-4 py-8 max-w-xl mx-auto"><div className="bg-panel border border-volt rounded-2xl p-5 text-center fade glow">
   <div className="text-3xl">✅</div><h2 className="text-lg font-bold text-white mt-1">Pesanan Tersimpan</h2>
   <p className="text-xs mt-1">Nomor pesanan Anda (simpan untuk cek status)</p><b className="block text-2xl text-ice tracking-wider my-1">${res.order_no}</b>
   <p className="text-sm">Total pesanan: <b className="text-white">${rp(est)}</b>${disc>0?` (sudah diskon ${rp(disc)})`:''}</p><p className="text-xs text-silver/60">Total akhir dikonfirmasi admin lewat WhatsApp.</p>
   <p className="text-xs mt-2 text-silver/70">Status pembayaran: belum terverifikasi. Berubah menjadi Lunas hanya setelah admin memverifikasi.</p>
   <a className="btn block mt-4" target="_blank" rel="noopener" href=${`https://wa.me/${CFG.ADMIN_WA}?text=${encodeURIComponent(msg)}`}>Lanjut ke WhatsApp Admin</a>
   <button className="text-xs text-ice mt-3" onClick=${()=>{setRes(null);setF({...f,note:''})}}>Buat pesanan baru</button></div></section>`}
 return html`<section id="pesan" className="px-4 py-8 max-w-xl mx-auto"><h2 className="text-xl font-bold text-white mb-4">Form Pemesanan</h2><div className="rounded-2xl border border-line bg-panel p-4 mb-4 text-xs"><b className="text-white text-sm">Proses Pemesanan</b><ol className="list-decimal pl-5 mt-2 space-y-1 text-silver"><li>Pilih rank saat ini dan jumlah bintang. Harga terhitung otomatis.</li><li>Isi nama dan nomor WhatsApp, centang peringatan, lalu tekan Kirim Pesanan.</li><li>Simpan nomor pesanan SR-… yang muncul.</li><li>Tekan tombol WhatsApp untuk menghubungi admin dan minta nomor tujuan pembayaran.</li><li>Bayar lewat DANA, GoPay, OVO, atau Transfer Bank, lalu kirim bukti bayar.</li><li>Admin memverifikasi. Status Lunas hanya setelah verifikasi, lalu pengerjaan dimulai.</li><li>Cek status kapan saja di bagian Status Pesanan.</li></ol></div>

  <label className="flex items-start gap-2 mt-3 text-silver"><input type="checkbox" className="!w-auto mt-0.5" checked=${agree} onChange=${e=>setAgree(e.target.checked)}/> Saya sudah membaca dan memahami peringatan di atas.</label></div>

function Track(){

function Info(){

function Admin(){
 const [st,setSt]=useState('init'),[em,setEm]=useState(''),[pw,setPw]=useState(''),[err,setErr]=useState('');
 const [D,setD]=useState({o:[],c:[],d:[],s:[]}),[tab,setTab]=useState('o'),[q,setQ]=useState('');
 const load=async()=>{
  const {data:adm}=await sb.rpc('is_admin');
  if(!adm){setSt('denied');return}
  const [o,c,d,s]=await Promise.all([sb.from('orders').select('*,customers(name,wa)').order('created_at',{ascending:false}),sb.from('customers').select('*').order('created_at',{ascending:false}),sb.from('deletion_requests').select('*').order('created_at',{ascending:false}),sb.from('services').select('*').order('sort')]);
  if(o.error||c.error)return setErr('Gagal memuat data: '+(o.error||c.error).message);
  setD({o:o.data,c:c.data,d:d.data||[],s:s.data||[]});setSt('ok')};
 useEffect(()=>{if(LIVE)sb.auth.getSession().then(({data})=>data.session?load():setSt('login'))},[]);
 const login=async()=>{setErr('');const {error}=await sb.auth.signInWithPassword({email:em,password:pw});if(error)return setErr('Email atau password salah.');await load()};
 const out=async()=>{await sb.auth.signOut();setSt('login')};
 const run=async p=>{const {error}=await p;if(error)alert('Gagal: '+error.message);else load()};
 if(!LIVE)return html`<section className="px-4 py-10 max-w-sm mx-auto text-sm">Dashboard admin membutuhkan Supabase. Isi SUPABASE_URL dan SUPABASE_ANON_KEY di bagian CFG, lalu muat ulang.</section>`;
 if(st==='init')return html`<div className="p-10 text-center">Memuat…</div>`;
 if(st!=='ok')return html`<section className="px-4 py-10 max-w-sm mx-auto"><h2 className="text-xl font-bold text-white mb-3">Login Admin</h2>
  <div className="bg-panel border border-line rounded-2xl p-4 space-y-3"><input type="email" value=${em} onChange=${e=>setEm(e.target.value)} placeholder="Email admin" autoComplete="username"/><input type="password" value=${pw} onChange=${e=>setPw(e.target.value)} placeholder="Password" autoComplete="current-password"/>
  <button className="btn w-full" onClick=${login}>Masuk</button>
  ${st==='denied'&&html`<p className="text-xs text-red-300">Akun ini bukan admin. <button className="underline" onClick=${out}>Keluar</button></p>`}
  ${err&&html`<p className="text-xs text-red-300">${err}</p>`}</div></section>`;
 const valid=D.o.filter(o=>o.status!=='Dibatalkan');
 const income=valid.filter(o=>o.payment_status==='lunas').reduce((a,o)=>a+o.total,0);
 const pending=valid.filter(o=>o.payment_status!=='lunas').reduce((a,o)=>a+o.total,0);
 const fo=D.o.filter(o=>(o.order_no+(o.customers?.name||'')+(o.customers?.wa||'')).toLowerCase().includes(q.toLowerCase()));
 return html`<section className="px-4 py-6 max-w-3xl mx-auto"><div className="flex justify-between items-center mb-3"><h2 className="text-xl font-bold text-white">Dashboard Admin</h2><button className="text-xs text-ice" onClick=${out}>Keluar</button></div>
 <div className="grid grid-cols-3 gap-2 text-center text-xs mb-4"><div className="bg-panel border border-line rounded-xl p-3">Pesanan<br/><b className="text-white text-lg">${D.o.length}</b></div><div className="bg-panel border border-line rounded-xl p-3">Pemasukan (lunas)<br/><b className="text-ice">${rp(income)}</b></div><div className="bg-panel border border-line rounded-xl p-3">Belum dibayar<br/><b className="text-silver">${rp(pending)}</b></div></div>
 <div className="flex gap-2 mb-3 text-xs">${[['o','Pesanan'],['c','Pelanggan'],['s','Harga']].map(([k,t])=>html`<button key=${k} onClick=${()=>setTab(k)} className=${tab===k?'btn !py-2':'btn2 !py-2'}>${t}</button>`)}</div>
 ${tab==='o'&&html`<div className="space-y-2"><input value=${q} onChange=${e=>setQ(e.target.value)} placeholder="Cari no. pesanan / nama / WhatsApp"/>${fo.map(o=>html`<div key=${o.id} className="bg-panel border border-line rounded-xl p-3 text-xs">
  <b className="text-white">${o.order_no}</b> · ${o.customers?.name||'(dihapus)'} · ${o.customers?.wa||'-'}<br/>${o.rank_from} → ${o.rank_to} · ${o.qty} bintang × ${rp(o.unit_price)} = <b className="text-ice">${rp(o.total)}</b>${o.note?html`<br/>Catatan: ${o.note}`:''}
  <div className="flex gap-2 mt-2"><select value=${o.status} onChange=${e=>run(sb.from('orders').update({status:e.target.value}).eq('id',o.id))}>${STATUS.map(s=>html`<option key=${s}>${s}</option>`)}</select>
  <button className=${o.payment_status==='lunas'?'btn !py-1 !px-3':'btn2 !py-1 !px-3'} onClick=${()=>run(sb.from('orders').update(o.payment_status==='lunas'?{payment_status:'belum_dibayar',paid_at:null}:{payment_status:'lunas',paid_at:new Date().toISOString()}).eq('id',o.id))}>${o.payment_status==='lunas'?'Lunas ✓':'Verifikasi bayar'}</button>${o.payment_status==='lunas'&&o.customers?.wa&&html`<a className="btn2 !py-1 !px-3" target="_blank" rel="noopener" href=${`https://wa.me/${o.customers.wa}?text=${encodeURIComponent('Halo '+o.customers.name+', pembayaran pesanan '+o.order_no+' sudah kami verifikasi LUNAS. Terima kasih sudah mempercayai SHADOWRANK! Pesananmu segera kami kerjakan. Your Rank, Our Mission 👑')}`}>Ucapkan terima kasih</a>`}</div></div>`)}</div>`}
 ${tab==='c'&&html`<div className="space-y-2">${D.d.filter(d=>d.status==='baru').map(d=>html`<div key=${d.id} className="bg-red-400/10 border border-red-400/30 rounded-xl p-3 text-xs flex justify-between items-center">Permintaan hapus data: ${d.wa}<button className="btn2 !py-1 !px-3" onClick=${()=>confirm('Anonimkan data pelanggan ini?')&&run(sb.rpc('process_deletion',{p_id:d.id}))}>Proses</button></div>`)}
  ${D.c.map(c=>{const os=D.o.filter(o=>o.customer_id===c.id);return html`<div key=${c.id} className="bg-panel border border-line rounded-xl p-3 text-xs flex justify-between items-center"><span><b className="text-white">${c.name}</b> · ${c.wa||'-'}<br/>${os.length} pesanan · lunas ${rp(os.filter(o=>o.payment_status==='lunas'&&o.status!=='Dibatalkan').reduce((a,o)=>a+o.total,0))}</span>${c.wa&&html`<button className="btn2 !py-1 !px-3" onClick=${()=>confirm('Anonimkan pelanggan ini?')&&run(sb.rpc('anonymize_customer',{p_id:c.id}))}>Anonimkan</button>`}</div>`})}</div>`}
 ${tab==='s'&&html`<div className="space-y-2">${D.s.map(s=>html`<div key=${s.code+s.price} className="bg-panel border border-line rounded-xl p-3 text-xs grid grid-cols-2 gap-2 items-end"><div><label>${s.name} — harga/bintang</label><input type="number" defaultValue=${s.price} onBlur=${e=>+e.target.value>0&&+e.target.value!==s.price&&run(sb.from('services').update({price:Math.round(+e.target.value)}).eq('code',s.code))}/></div>
  <label className="flex items-center gap-2 pb-2"><input type="checkbox" className="!w-auto" defaultChecked=${s.active} onChange=${e=>run(sb.from('services').update({active:e.target.checked}).eq('code',s.code))}/> Aktif</label></div>`)}
  <p className="text-xs text-silver/60">Perubahan harga hanya berlaku untuk pesanan baru; pesanan lama menyimpan harga saat dipesan.</p></div>`}</section>`}

function App(){
